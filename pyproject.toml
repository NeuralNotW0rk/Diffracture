[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "diffracture"
version = "0.1.0"
description = "A modular PyTorch library for injecting low-rank adapters and network-bending transforms into trained models."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
dependencies = [
    "torch>=2.0.0",
    "safetensors",
    "torchvision",
]

[project.urls]
Repository = "https://github.com/NeuralNotW0rk/Diffracture"
